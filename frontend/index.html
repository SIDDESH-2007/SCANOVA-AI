<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/scanova-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Scanova AI</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="error-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:9999; padding:20px; color:red; overflow:auto;">
      <h1>Application Error</h1>
      <pre id="error-message" style="white-space:pre-wrap; font-size:16px;"></pre>
    </div>
    <script>
      window.addEventListener('error', function(event) {
        document.getElementById('error-overlay').style.display = 'block';
        document.getElementById('error-message').textContent = event.error ? event.error.stack : event.message;
      });
      window.addEventListener('unhandledrejection', function(event) {
        document.getElementById('error-overlay').style.display = 'block';
        document.getElementById('error-message').textContent = 'Unhandled Rejection: ' + (event.reason ? event.reason.stack || event.reason : 'Unknown');
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
